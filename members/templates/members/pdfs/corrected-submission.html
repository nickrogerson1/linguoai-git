{% load static %}

<head>
    <style>
    .diff_chg {
        color: red;
    }

    .diff_sub {
        color: #c9bf5d;
    }

    .diff_add {
        color: green;
    }

    td {
        vertical-align: top;
        padding-left: 3px;
        max-width: 500px;
        white-space: break-spaces;
        color: black;
    }

    #guide {
        border:1px solid black;
        margin-left: auto;
        margin-right: auto;
    }

    #guide td, #guide tr {
        border:1px solid black;
    }

    table {
        border-collapse: collapse;
    }

    #guide th {
        text-align: center;
        font-weight: 300;
    }

    #guide td {
        padding: 2px 20px;
    }

    #main-table th {
        border: 1px solid white !important;
        text-align: center;
        padding-bottom: 10px;
        font-size: 25px;
        font-weight: 300;
    }

    .main-table td {
        border: 1px solid black !important;
    }

    .main-table td:nth-child(even) {
        padding: 10px;
    }

    /* @font-face {
        font-family: Poppins-Medium;
        src: url("{% static '/fonts/Poppins/Poppins-Medium.ttf' %}");
    } */

    @font-face {
        font-family: JetBrains Mono;
        src: url("{% static '/fonts/JetBrainsMono-Light.ttf' %}");
    }

    .main-content {
        font-family: Poppins-Medium;
    }

    .logo-default {
        font-family: JetBrains Mono;
        font-size: 20px;
    }

    h2 {
        font-weight: 300;
        text-align: center;
    }

    @page {
        margin: 10px 20px;
    }

    .theme-color {
        color: #4F81BD;
    }
    </style>
</head>
<body>
    <h3 class="logo-default">linguo::ai</h3>
        <div class="main-content">
            <h2 class="theme-color">Your Corrected Submission</h2>
            <div class="page">
                <table id="guide">
                    <thead>
                        <tr >
                            <th colspan="3">Colour Codes</th>
                        </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td class="diff_add">Green | Additions</td>
                    
                        <td class="diff_sub">Yellow | Substitutions</td>
                    
                        <td class="diff_chg">Red | Changes</td>
                    </tr>
                    </tbody>
                </table>
            </div>
                <br>          
                <div class="table-responsive overflow-hidden main-table">
                    {{ corrections|safe }} 
                </div>
            <h5 class="theme-color">This submission was made on {{ date }}</h5>
        </div>
</body>
