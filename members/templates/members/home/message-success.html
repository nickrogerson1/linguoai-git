{% extends "../layouts/base.html" %}

{% block title %} Your message has been sent! {% endblock title%} 

{% block content %}

<div class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12 col-lg-10 offset-lg-1 pt-4 mt-5">
        <div class="card" >
          <div class="card-body px-2 py-2">
            <div>
              <div class="alert text-center" role="alert">
                  <h3>Thanks for getting in touch, {{ request.session.name }}!</h3>
                  <p>We will get back to you as soon as possible with our response.</p>
                  <br>
                  <a href="{% url 'home' %}" >Go back to the dashboard</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
