
<div class="toggle faq pb-0 mb-3">
    <div class="toggle-header">
        <div class="toggle-icon">
            <i class="toggle-closed bi bi-plus"></i>
            <i class="toggle-open bi bi-dash"></i>
        </div>
        <div class="toggle-title fw-medium ps-1">{{ question }}</div>
        <div class="toggle-icon">
            <i class="toggle-closed fa-solid fa-chevron-down"></i>
            <i class="toggle-open fa-solid fa-chevron-up"></i>
        </div>
    </div>
    <div class="toggle-content ps-4">{{ answer }}</div>
</div>
