{% load static %}

{% block header %}

<style>
@media (max-width: 992px) {
	#menu-buttons {
		margin-bottom: 20px;
		border-top: var(--cnvs-primary-menu-submenu-border);
	}
	#menu-buttons li {
		margin-top: 14px;
	}
}

	#menu-buttons a:first-child {
		margin-right: 10px;
}
</style>

{% endblock header %}

<div class="block-nav-header">
		<!-- Header
		============================================= -->
		<header id="header" class="header-size-md">
			<div id="header-wrap" class="border-bottom-0">
				<div class="container position-relative">
                    
                    <div class="header-row">

						<!-- Logo
						============================================= -->
						<div id="logo">
							<a href="/">
								<!-- <img class="logo-default" srcset="{% static 'images/logo.png' %}, {% static 'images/logo@2x.png 2x' %}" src="{% static 'images/logo@2x.png' %}" alt="Canvas Logo">
								<img class="logo-dark" srcset="{% static 'images/logo-dark.png' %}, {% static 'images/logo-dark@2x.png 2x' %}" src="{% static 'images/logo-dark@2x.png' %}" alt="Canvas Logo"> -->
								<img class="logo-default" src="{% static 'linguoai-logo.svg' %}" alt="Linguo AI Logo">
							</a>
						</div><!-- #logo end -->


						<!-- Primary Navigation icon in mobile
						============================================= -->
						<div class="primary-menu-trigger">
							<button class="cnvs-hamburger" type="button" title="Open Mobile Menu">
								<span class="cnvs-hamburger-box"><span class="cnvs-hamburger-inner"></span></span>
							</button>
						</div>

						<!-- Primary Navigation
						============================================= -->
						<nav class="primary-menu">

							<ul class="menu-container">
								<li class="menu-item current">
									<a class="menu-link" href="#"><div>Home</div></a>
								</li>
								<li class="menu-item">
									<a class="menu-link" href="#service"><div>Services</div></a>
								</li>
								<li class="menu-item">
									<a class="menu-link" href="#benefits"><div>Benefits</div></a>
								</li>
								<li class="menu-item">
									<a class="menu-link" href="#pricing"><div>Pricing</div></a>
								</li>
								<li class="menu-item">
									<a class="menu-link" href="#about"><div>About</div></a>
								</li>
								<li class="menu-item">
									<a class="menu-link" href="#faqs"><div>FAQs</div></a>
								</li>
								<div id="menu-buttons" style="display:flex;">
									<li class="menu-item">
										<div>
											<a href="{% url 'register' %}"><button type="button" class="btn btn-primary">Sign Up</button></a>
										</div>
									</li>
									<li class="menu-item">
										<div>
											<a href="{% url 'login' %}"><button type="button" class="btn btn-outline-primary">Log In</button></a>
										</div>
									</li>
								</div>
							</ul>
								<div class="morph-marker"></div>
						</nav><!-- #primary-menu end -->

					</div>
				</div>

				
			</div>
			<div class="header-wrap-clone"></div>
		</header><!-- #header end -->
