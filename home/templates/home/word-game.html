{% load static %}

<!DOCTYPE html>
<head>

<style>
:root {
  --title-color: #d5d5d5;
  --color-success: #41c864;
}

@font-face {
    font-family: "Montserrat";
    src: url("{% static 'fonts/Montserrat-Regular.ttf' %}");
}

body {
  font-family:  "Montserrat";
  font-size: 16px;
  background-color: #f4f4f4;
  touch-action: none;
}

.c-layout {
  background-color: #fff;
  border-radius: 2px;
  /* box-shadow: 2px 2px 2px #333; */
  width: 90%;
  /* height: 80%; */
}

.c-layout__screen {
  /* width: 920px; */
  height: 640px;
  display: flex;
  flex-direction: column;
  justify-content: center;
      align-items: center;
}

.c-headline {
  font-size: 3rem;
  font-weight: 500;
  text-transform: uppercase;
  text-align: center;
  color: var(--title-color);
  line-height: 60px;
}

.c-word-container {
  color: #000;
  font-size: 21px;
  height: 50%;
  /* width: calc(100% - 60px); */
  width: 90%;
  margin-bottom: 1rem;
  position: relative;
}

.c-word {
  cursor: pointer;
  user-select: none;
  padding: .25rem;
  position: absolute;
  font-size: 3rem;
}

.c-word.is-dragging {
  opacity: .4;
  pointer-events: none; 
}

.c-word.is-immutable {
  color: var(--color-success);
  position: initial;
  top: auto;
  left: auto;
  pointer-events: none; 
}

.c-timer {
  font-size: .75rem;
  color: #888;
  height: 20%;
}

.c-score {
  font-size: 2.5rem;
  color: #000;
  margin-bottom: 2rem;
}

.c-word-box {
  width: 100%;
  position: absolute;
  bottom: 0;
}

.c-word-box-entries {
  width: 100%;
  height: 4rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.c-word-box-line {
  background-color: #888;
  height: 1px;
  transition: background-color ease-out 300ms, transform ease-out 300ms;
}

.c-word-box.is-invalid .c-word-box-line {
   background-color: #eb4141;
  transform: scaleY(5);
}

.c-word-box.is-valid .c-word-box-line {
   background-color: var(--color-success);
  transform: scaleY(5);
}

.c-instruction {
  color: #d5d5d5;
  font-size: .75rem;
}

.c-btn {
    cursor: pointer;
  color: #fff;
  font-size: 18px;
  text-transform: capitalize;
  background-color: #41c864;
  border: none;
  padding: 1rem 4rem;
}

.u-center {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  transform: translate(-50%, -50%) !important;
}

#score-span {
    margin-right: 60px;
}

countdown-timer {
  display: block;
  width: 100%;
  height: 100%;
  text-align: center;
  overflow: hidden;
  position: relative;
}

  font-family: 'Roboto Condensed';
  font-style: italic;
  font-weight: 700;
  src: url(https://fonts.gstatic.com/s/robotocondensed/v27/ieVW2ZhZI2eCN5jzbjEETS9weq8-19ehAyvMum7nfDB64f8N1X5pKQ.ttf) format('truetype');
} */

#countdown {
  font-family: "Roboto Condensed", sans-serif;
  width: 200px;
  height: 100px;
  position: absolute;
  left: 50%;
  top: 15%;
  margin-left: -100px;
  margin-top: -50px;
  color: black;
  font-size: 5em;
  text-align: center;
  font-weight: bold;
  font-style: italic;
  -webkit-opacity: 1;
  -moz-opacity: 1;
  opacity: 1;
  -webkit-transition: opacity 0.4s ease;
  -moz-transition: opacity 0.4s ease;
  -ms-transition: opacity 0.4s ease;
  -o-transition: opacity 0.4s ease;
  /* solve for flicker problem */
  -webkit-perspective: 1000;
  -webkit-backface-visibility: hidden;
}
#countdown.puffer {
  -webkit-opacity: 0;
  -moz-opacity: 0;
  opacity: 0;
  -webkit-transform: scale(1.6, 1.6);
  -moz-transform: scale(1.6, 1.6);
  -ms-transform: scale(1.6, 1.6);
  -o-transform: scale(1.6, 1.6);
  -webkit-transition: all 0.4s ease-out;
  -moz-transition: all 0.4s ease-out;
  -ms-transition: all 0.4s ease-out;
  -o-transition: all 0.4s ease-out;
}

#countdown.warning {
    color: #FFBF00;
}

#countdown.danger {
    color: red;
}



h1 {
    text-transform: uppercase;
    font-size: 3.5rem;
    color: red;
    text-align: center;
}

h2 {
    margin-top: 0;
    font-size: 4rem;
    text-align: center;
}

h2 span {
    font-size: 2.5rem;
    
}

let wins = losses = 0

let usedSentences = []
let currSentence = ''



class App extends HTMLElement {
      constructor() {
        super();
        this.selectedScreenName = 'start';
        const initializers = {
          start: StartScreen,
          game: GameScreen,
          score: ScoreScreen
        }
        let props = { timespan: 2000 };
        this.selectedScreen = new initializers[this.selectedScreenName](props);
        this.appendChild(this.selectedScreen);
        
        this.addEventListener('command', e => {
          const screen = e.detail.screen;
          if (screen !== this.selectedScreenName) {
            props = {...props, ...e.detail.props};
            this.selectedScreen.remove();
            this.selectedScreenName = screen;
            this.selectedScreen = new initializers[this.selectedScreenName](props);
            this.appendChild(this.selectedScreen); 
          }
          if(this.selectedScreenName === 'score'){
            const chineseTrans = sentences.find(x => x[0] === currSentence)[1]
            const space = currSentence.split(' ').length > 5 ? '<br>' : '&nbsp;&nbsp;'
            this.querySelector('h1').innerHTML = currSentence + space + chineseTrans
            this.querySelector('h2').innerHTML = e.detail.result ? `Good Job! You Won!<br><span>With ${e.detail.props.timeLeft} Seconds Left</span>` : 'You Lost! Game Over!'
          }
       
        });
      }
    }
    
    class Screen extends HTMLElement {
      constructor(templateId, props = {}) {
        super();
        const templateNode = document.getElementById(templateId);
        if(!templateNode) {
          throw new Error(`Cannot find the associated template for screen component. ID: ${templateId}`);
        }
        const clone = document.importNode(templateNode.content, true);
        this.classList.add("c-layout__screen", ...(props.classNames || []));
        this.appendChild(clone);
      }
    }

   class StartScreen extends Screen {
     constructor() {
        super("tScreenStart", {
          classNames: ["c-screen-start"]
        });
       this.querySelector('.js-command-game').addEventListener('click', () => {
         const event = new CustomEvent('command', { detail: { screen: 'game' }, bubbles : true });
         this.dispatchEvent(event);
       });
     }
   }

class ScoreScreen extends Screen {
     constructor({timespan}) {
        super("tScreenScore", {
          classNames: ["c-screen-score"]
        });
       const score = this.querySelector('.c-score');
       score.render();

       
       this.querySelector('.js-command-game').addEventListener('click', () => {
         const event = new CustomEvent('command', { detail: { screen: 'game' }, bubbles : true });
         this.dispatchEvent(event);
       });
     }
   }
    


// Review how this works!!
    class GameScreen extends Screen {
      constructor({ content }) {
        
        super("tScreenGame", {
          classNames: ["c-screen-game"]
        });

        this.chooseRandomSentence()
        content = currSentence
        
        this.timer = this.querySelector('#countdown');   
        this.instruction = this.querySelector('.c-instruction');
        this.container = this.querySelector('.c-word-container');
        this.box = this.querySelector('.c-word-box');
        this.dropZone = this.querySelector('.c-word-box-entries');
        // this.instruction.textContent = `Form the phrase "${content}" on the line above`;
        
        // console.log(`CONTENT ${content}`)
        this.words = content.split(' ');
        this.wordElements = this.words.map(word => new Word(word));
        
        this.draggedWord = undefined;
        this.selections = [];
        
        for(const word of this.wordElements) {
          this.container.appendChild(word); 
        }
      }
      
      connectedCallback() {
        
        this.container.addEventListener('pointerdown', e => {
          // Solves issue of events not firing
          e.target.releasePointerCapture(e.pointerId)
          if(e.target instanceof Word) {
               this.draggedWord = e.target;
               this.draggedWord.classList.add('is-dragging');
          }
       });

       ['pointerup', 'pointerleave'].forEach(x => {
            this.container.addEventListener( x, ()=> {
                if(this.draggedWord) {
                this.draggedWord.savePosition();
                this.draggedWord.classList.remove('is-dragging');
                this.draggedWord = undefined;
            }
        })
       });
        
        this.dropZone.addEventListener('pointerover', e => {
          
          console.log('Fired!')
          e.preventDefault()
          const draggedWord = this.draggedWord;
         if(draggedWord) {
           const accepted = this.process(draggedWord.content);
           this.box.classList.add(accepted ? 'is-valid' : 'is-invalid');
         }
       });
        
         this.dropZone.addEventListener('pointerup', () => {
          const draggedWord = this.draggedWord;
         if(draggedWord) {
           const accepted = this.process(draggedWord.content);
           if(accepted > 0) {
             this.putToBox(draggedWord);
           }
           if(accepted < 0) {
             this.putToBox(draggedWord, true);
           }

        // if they win
           if(this.selections.length === this.words.length) {
              wins++
              const event = new CustomEvent('command', { detail: { screen: 'score', props: { timeLeft: this.timer.innerText }, 'result': 1 }, bubbles : true });
              this.dispatchEvent(event);
           }

           if(this.box.classList.contains('is-invalid')) {
               this.draggedWord.revertPosition();
           }
           this.box.classList.remove('is-invalid', 'is-valid');
         }
       });
        
        this.box.addEventListener('pointerleave', () => {
          this.box.classList.remove('is-invalid', 'is-valid');
       });
        
       const {width, height} = this.container.getBoundingClientRect(); 
        
       this.addEventListener('pointermove', e => {
         const draggedWord = this.draggedWord;
          if (draggedWord) {
            draggedWord.style.top = Math.max(Math.min(parseInt(draggedWord.style.top, 10) + e.movementY, height - draggedWord.clientHeight), 0) + 'px';
            draggedWord.style.left = Math.max(Math.min(parseInt(draggedWord.style.left, 10) + e.movementX, width - draggedWord.clientWidth), 0) + 'px';
          }
       });
      }
      
    // Handles when the word is put into the box
      putToBox(word, prependOrAppend) {
        word.classList.add('is-immutable');
        
        for(const w of this.wordElements) {
          w.tempDim = w.getBoundingClientRect();
        }
        
        if(prependOrAppend) {
          this.selections.push(word.content);
          this.dropZone.prepend(word);
        } else {
          this.selections.unshift(word.content);
           this.dropZone.append(word);
        }
        
        for(const w of this.wordElements) {
          const { x, y } = w.getBoundingClientRect();
          const dx = x - w.tempDim.x;
          const dy = y - w.tempDim.y;
          if(dx || dy) {
                      w.animate([
            { 
              transform: `translate(${-dx}px, ${-dy}px)`
            },
            {
              transform: `translate(0, 0)`
            }
          ], {duration: 300}).finished.then(() => { 
             w.tempDim = undefined;
          });
          }
        }
      }
      


      disconnectedCallback() {
        this.timer = undefined;
        this.instruction = undefined;
      }

      process(word) {

    // Rejects sentences with the same word more than once here!
        if(!word || this.selections.includes(word)) {
          return;
        }
        if(this.selections.length === 0) {
          return 1;
        }
        const index = this.words.indexOf(word);

        if (index > 0) {
            const prevWord = this.words[index - 1];
            if(this.selections.includes(prevWord)) {
              return 1;
            }
          
        }
        if (index < this.words.length - 1) {
            const nextWord = this.words[index + 1];
          if(this.selections.includes(nextWord)) {
            return -1;
            }
        }
      }


        chooseRandomSentence = () => {
            const chosenSentence = sentences[Math.floor(Math.random() * sentences.length)][0]
            // console.log(chosenSentence)

            if(!usedSentences.includes(chosenSentence)){
                usedSentences.push(chosenSentence)
                return currSentence = chosenSentence
            } else if(usedSentences.length === sentences.length){
                usedSentences = []
            }
            // console.log(`USED SENTENCES: ${usedSentences.length}`)
            return this.chooseRandomSentence()
        
        }


    }

     }
     
     revertPosition() {
       this.setPosition(this.recentPos);
     }
     
     setPosition({top, left}) {
       this.style.top = top;
       this.style.left = left;
     }

        anim() {
            setTimeout(() => this.classList.add('puffer'), 600)

            // && !this.classList.includes('warning')
            if (this.currentNum <= WARNING_THRESHOLD && this.currentNum > DANGER_THRESHOLD ){
                this.classList.add('warning')
                this.currentNum--
            } else if (this.currentNum <= DANGER_THRESHOLD && this.currentNum > 1) {
                this.classList.add('danger')
                this.classList.remove('warning')
                this.currentNum--
            } else if (this.currentNum > 1){
                this.currentNum--
            } else {
                losses++
                this.stop()
                const event = new CustomEvent('command', { detail: { screen: 'score', result: 0 }, bubbles : true });
                this.dispatchEvent(event);
            } 
            this.innerText = this.currentNum;
            this.classList.remove("puffer");
        }

        countdownSetup() { 
            this.currentNum = TIME_LIMIT
            this.innerText = this.currentNum;
            setTimeout(() => this.classList.add('puffer'), 600)
            this.classList.remove("puffer");
            this.token = setInterval(() => this.anim(), 1000);
        }
