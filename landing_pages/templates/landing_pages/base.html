<script>
// block-misc-sticky-cards
    jQuery('.block-sticky-cards-wrap .sticky-section').each( function(i) {
        var gap = getComputedStyle(this).getPropertyValue('--sticky-top-gap');
        jQuery(this).css({

        });

(function ($) {
    var methods = { on: $.fn.on, bind: $.fn.bind };
    $.each(methods, function(k){
        $.fn[k] = function () {
            var args = [].slice.call(arguments),
                delay = args.pop(),
                fn = args.pop(),
                timer;

            args.push(function () {
                var self = this,
                    arg = arguments;
                clearTimeout(timer);
                timer = setTimeout(function(){
                    fn.apply(self, [].slice.call(arg));
                }, delay);
            });

            return methods[k].apply(this, isNaN(delay) ? arguments : args);
        };
    });
}(jQuery));




(function($) {

    function Ticker( elem ) {

        // console.log(elem)
        elem.lettering();
        this.done = false;
        this.cycleCount = 5;
        this.cycleCurrent = 0;
        this.chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890!@#$%^&*()-_=+{}|[]\\;\':"<>?,./`~'.split('');
        this.charsCount = this.chars.length;
        this.letters = elem.find( 'span' );
        this.letterCount = this.letters.length;
        this.letterCurrent = 0;
        this.width = window.innerWidth


        this.letters.each( function() {
            var $this = $( this );
            $this.attr( 'data-orig', $this.text() );
            $this.text( '-' );
        });
    }


    Ticker.prototype.getChar = function() {
        return this.chars[ Math.floor( Math.random() * this.charsCount ) ];
    };

    Ticker.prototype.reset = function() {


        this.done = false;
        this.cycleCurrent = 0;
        this.letterCurrent = 0;
    
        this.letters.each( function() {
            var $this = $( this );
            $this.text( $this.attr( 'data-orig' ) );
            $this.removeClass( 'done' );
        });
        this.loop();
    };

    Ticker.prototype.loop = function() {
        var self = this;

        // console.log(this.letters)

        this.letters.each( function( index, elem ) {
            var $elem = $( elem );
            
            if( index >= self.letterCurrent ) {
                // console.log(self.letterCurrent)
                if( $elem.text() !== ' ' ) {
                    $elem.text( self.getChar() );
                    $elem.css( 'opacity', Math.random() );
                }
            }
        });

        if( this.cycleCurrent < this.cycleCount ) {
            this.cycleCurrent++;
        } else if( this.letterCurrent < this.letterCount ) {
            var currLetter = this.letters.eq( this.letterCurrent );
            this.cycleCurrent = 0;
            currLetter.text( currLetter.attr( 'data-orig' ) ).css( 'opacity', 1 ).addClass( 'done' );
            this.letterCurrent++;
        } else {
            this.done = true;
        }

        if( !this.done ) {
            requestAnimationFrame( function() {
                self.loop();
            });
        } 
        else {
            if (window.innerWidth !== this.width){
                return
            }
            setTimeout( function() {
                self.reset();
                // console.log(self)
    // Set the wait time between spins
            }, 1000 );
        }
    };


    
    let words = $( '.word' );

    const initTicker = () => {

        if (window.innerWidth > 600) {
            $(words[0]); $(words[0]).show(); $(words[1]).hide() 
        } else {
            $(words[1]); $(words[1]).show(); $(words[0]).hide() 
        }

        const ticker = new Ticker( words ).reset();
        console.log(window.innerWidth)

    }

    $( document ).ready(initTicker)

    $( window ).on('resize', initTicker, 3000)


})(jQuery);






const elts = {
	text1: document.getElementById("text1"),
	text2: document.getElementById("text2")
};

// The strings to morph between. You can change these to anything you want!
const texts = [
	"What",
	"Are",
	"You",
	"Waiting",
	"For?",
	"Get",
	"Better",
    "IELTS",
	"Scores",
    "Now!",
];

// Controls the speed of morphing.
const morphTime = 1;
const cooldownTime = 0.25;

let textIndex = texts.length - 1;
let time = new Date();
let morph = 0;
let cooldown = cooldownTime;

elts.text1.textContent = texts[textIndex % texts.length];
elts.text2.textContent = texts[(textIndex + 1) % texts.length];

function doMorph() {
	morph -= cooldown;
	cooldown = 0;
	
	let fraction = morph / morphTime;
	
	if (fraction > 1) {
		cooldown = cooldownTime;
		fraction = 1;
	}
	
	setMorph(fraction);
}

// A lot of the magic happens here, this is what applies the blur filter to the text.
function setMorph(fraction) {
	
	elts.text2.style.filter = `blur(${Math.min(8 / fraction - 8, 100)}px)`;
	elts.text2.style.opacity = `${Math.pow(fraction, 0.4) * 100}%`;
	
	fraction = 1 - fraction;
	elts.text1.style.filter = `blur(${Math.min(8 / fraction - 8, 100)}px)`;
	elts.text1.style.opacity = `${Math.pow(fraction, 0.4) * 100}%`;
	
	elts.text1.textContent = texts[textIndex % texts.length];
	elts.text2.textContent = texts[(textIndex + 1) % texts.length];
}

function doCooldown() {
	morph = 0;
	
	elts.text2.style.filter = "";
	elts.text2.style.opacity = "100%";
	
	elts.text1.style.filter = "";
	elts.text1.style.opacity = "0%";
}

// Animation loop, which is called every frame.
function animate() {
	requestAnimationFrame(animate);
	
	let newTime = new Date();
	let shouldIncrementIndex = cooldown > 0;
	let dt = (newTime - time) / 1000;
	time = newTime;
	
	cooldown -= dt;
	
	if (cooldown <= 0) {
		if (shouldIncrementIndex) {
			textIndex++;
		}
		
		doMorph();
	} else {
		doCooldown();
	}
}

// Start the animation.
animate();


</script>
